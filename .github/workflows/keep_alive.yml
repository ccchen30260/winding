name: Keep Supabase Alive

on:
  schedule:
    # 每 3 天在 00:00 UTC 執行一次（避開 7 天自動暫停）
    - cron: '0 0 */3 * *'
  workflow_dispatch: # 允許在 GitHub 頁面上手動觸發執行測試

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
