<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>捲繞排班(S1~S4)</title>
    <style>
        :root {
            --bg-day: #c6e0b4;
            --bg-g: #ffff00;
            --bg-special: #ff00ff;
            --bg-personal: #8064a2;
            --bg-night: #fce4d6;
            --text-personal: #ffffff;
            --bg-sick: #ff0000;
            --text-sick: #ffffff;
            --bg-physio: #ffe6cc;
            --bg-typhoon: #dae8fc;
            --bg-unattended: #d0d0d0;
            --border-color: #a0a0a0;
        }

        /* 核心布局优化：占满 100vh 屏幕高度，隐藏整体滚动 */
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #fcfcfc;
            touch-action: manipulation;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }

        .sync-status {
            position: fixed;
            bottom: 10px;
            right: 110px;
            background-color: rgba(0,0,0,0.75);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: none;
            z-index: 10001;
        }

        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(245, 247, 250, 0.98);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-card {
            background-color: #ffffff;
            padding: 30px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-sizing: border-box;
            border: 1px solid #e0e0e0;
        }

        .login-card h2 { margin-top: 0; margin-bottom: 20px; color: #333; font-size: 20px; }

        .login-field { margin-bottom: 15px; text-align: left; }
        .login-field label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: bold; color: #555; }
        .login-field input, .login-field select, .login-field textarea {
            width: 100%; padding: 10px; font-size: 15px; border: 1px solid #ccc;
            border-radius: 6px; box-sizing: border-box; background-color: #fff; outline: none;
            resize: vertical; font-family: inherit;
        }

        .login-btn { width: 100%; padding: 10px; font-size: 16px; font-weight: bold; color: #fff; background-color: #28a745; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; transition: background-color 0.2s; }
        .login-btn:hover { background-color: #218838; }

        .login-error { color: #dc3545; font-size: 13px; margin-top: 12px; display: none; font-weight: bold; }

        .main-app { display: none; flex-direction: column; height: 100%; overflow: hidden; box-sizing: border-box; gap: 5px; }

        .header-controls { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; width: 100%; box-sizing: border-box; flex-shrink: 0; }
        .left-controls, .right-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; max-width: 100%; }
        .left-controls { flex: 1 1 auto; }
        .control-group { display: flex; align-items: center; background-color: #00ff00; padding: 2px 4px; border: 1px solid #000; border-radius: 4px; box-sizing: border-box; }
        .control-group span { font-weight: bold; padding: 0 4px; white-space: nowrap; font-size: 13px; }

        .total-stats-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .stat-badge { font-size: 13px; font-weight: bold; padding: 4px 8px; border-radius: 4px; white-space: nowrap; border: 1px solid #bbb; }
        .stat-badge-ot { background-color: #e6f7ff; color: #0073e6; border-color: #91d5ff; }
        .stat-badge-lv { background-color: #ffe6e6; color: #d9363e; border-color: #ffa39e; }
        .stat-badge-ua { background-color: #e2e2e2; color: #495057; border-color: #ced4da; }

        select { font-size: 14px; padding: 4px; border: 1px solid #ccc; background-color: #ffe6e6; border-radius: 4px; outline: none; }
        select:disabled { background-color: #e0e0e0; color: #666; cursor: not-allowed; }

        .user-info { font-size: 13px; font-weight: bold; color: #333; background-color: #e9ecef; padding: 5px 8px; border-radius: 4px; white-space: nowrap; }

        .change-pwd-btn, .logout-btn, .toggle-btn, .form-status-btn, .highlight-btn, .edit-marquee-btn, .edit-employee-btn {
            padding: 6px 8px; font-size: 12px; font-weight: bold; color: #fff; border: none; border-radius: 4px; cursor: pointer; white-space: nowrap;
        }
        .change-pwd-btn { background-color: #17a2b8; }
        .logout-btn { background-color: #dc3545; }
        .toggle-btn { background-color: #007bff; }
        .highlight-btn { background-color: #6f42c1; }
        .highlight-btn.active { background-color: #28a745; }
        .highlight-btn:disabled { cursor: not-allowed; opacity: 0.7; }
        .edit-marquee-btn { background-color: #fd7e14; }
        .edit-employee-btn { background-color: #e83e8c; }

        .form-status-btn.open { background-color: #28a745; }
        .form-status-btn.closed { background-color: #6c757d; }
        .form-status-btn:disabled { cursor: not-allowed; opacity: 0.85; }

        .btn-confirm {
            position: fixed; bottom: 25px; right: 25px; z-index: 9999; display: none; padding: 15px 25px;
            font-size: 20px; font-weight: bold; color: #fff; background-color: #28a745; border: none;
            border-radius: 50px; box-shadow: 0 4px 15px rgba(40, 167, 69, 0.5); cursor: pointer;
            transition: all 0.3s ease; user-select: none;
        }
        .btn-confirm:hover:not(:disabled) { background-color: #218838; transform: scale(1.05); box-shadow: 0 6px 20px rgba(40, 167, 69, 0.6); }
        .btn-confirm:active:not(:disabled) { transform: scale(0.95); }
        .btn-confirm:disabled { background-color: #a0a0a0 !important; box-shadow: none !important; cursor: default !important; transform: scale(1) !important; opacity: 1 !important; }

        .custom-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); display: none; justify-content: center; align-items: center; z-index: 10000; }
        .custom-modal-box { background-color: #ffffff; padding: 40px 30px; border-radius: 16px; max-width: 450px; width: 90%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .custom-modal-box h3 { margin-top: 0; margin-bottom: 25px; font-size: 22px; line-height: 1.5; }
        .custom-modal-box p { font-size: 16px; color: #333; margin-bottom: 25px; line-height: 1.6; }
        .modal-btn-group { display: flex; justify-content: center; gap: 15px; }
        .modal-btn-confirm, .modal-btn-cancel { padding: 12px 30px; font-size: 17px; font-weight: bold; border: none; border-radius: 30px; cursor: pointer; transition: 0.2s; }
        .modal-btn-confirm { background-color: #28a745; color: #fff; }
        .modal-btn-confirm:hover { background-color: #218838; }
        .modal-btn-cancel { background-color: #e9ecef; color: #333; border: 1px solid #ced4da; }
        .modal-btn-cancel:hover { background-color: #dde0e3; }

        .table-container { overflow: auto; flex: 1; min-height: 0; box-shadow: 0 0 10px rgba(0,0,0,0.1); background-color: white; -webkit-overflow-scrolling: touch; }
        table { border-collapse: separate; border-spacing: 0; width: 100%; text-align: center; font-size: 14px; background-color: white; white-space: nowrap; }
        th, td { border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); padding: 0; min-width: 32px; height: 38px; box-sizing: border-box; background-clip: padding-box; }
        th:first-child, td:first-child { border-left: 1px solid var(--border-color); }
        tr:first-child th { border-top: 1px solid var(--border-color); }
        th { background-color: #f2f2f2; font-weight: bold; }
        thead tr:nth-child(1) th { position: sticky; top: 0; z-index: 1; }
        thead tr:nth-child(2) th { position: sticky; top: 38px; z-index: 1; }
        thead tr:nth-child(3) th { position: sticky; top: 76px; z-index: 1; }

        .stats-ot { position: sticky; left: 0; width: 40px; min-width: 40px; z-index: 2; color: #00b0f0; background-color: #e6f7ff; font-weight: bold; }
        .stats-lv { position: sticky; left: 40px; width: 40px; min-width: 40px; z-index: 2; color: #ff0000; background-color: #ffe6e6; font-weight: bold; }
        .col-name { position: sticky; left: 80px; width: 65px; min-width: 65px; z-index: 2; font-weight: bold; background-color: #fafafa; box-shadow: 2px 0 5px -2px rgba(0,0,0,0.3); }
        thead th.stats-ot, thead th.stats-lv, thead th.col-name { z-index: 3 !important; background-color: #e0e0e0; color: black; }

        body.hide-stats .stats-ot, body.hide-stats .stats-lv { display: none !important; }
        body.hide-stats .col-name { left: 0 !important; }

        .weekend-header { color: red; }
        .today-header { background-color: #00ffff !important; }

        tr.daily-ot-row { background-color: #fffbe6; font-weight: bold; }
        tr.daily-ot-row td { background-color: #fffbe6; color: #d48806; border-top: 2px solid #ffe58f; }
        tr.daily-ot-row td.col-name { background-color: #fff1b8; color: #873800; }
        tr.daily-ot-row td.stats-ot, tr.daily-ot-row td.stats-lv { background-color: #fff1b8; }

        .cell-content { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; min-height: 38px; box-sizing: border-box; }
        .shift-select { width: 100%; height: 38px; border: none; background-color: transparent; font-size: 15px; font-family: inherit; text-align: center; text-align-last: center; appearance: none; -webkit-appearance: none; -moz-appearance: none; cursor: pointer; outline: none; color: inherit; font-weight: inherit; }
        .shift-select:disabled { cursor: not-allowed; opacity: 1 !important; background-color: transparent !important; color: inherit !important; }

        .shift-day { background-color: var(--bg-day); }
        .shift-night { background-color: var(--bg-night); }
        .shift-g { background-color: var(--bg-g); color: black; font-weight: bold; }
        .shift-unattended { background-color: var(--bg-unattended); color: black; font-weight: bold; }
        .shift-special { background-color: var(--bg-special); color: black; font-weight: bold; }
        .shift-personal { background-color: var(--bg-personal); color: var(--text-personal); font-weight: bold; }
        .shift-sick { background-color: var(--bg-sick); color: var(--text-sick); font-weight: bold; }
        .shift-physio { background-color: var(--bg-physio); color: black; font-weight: bold; }
        .shift-typhoon { background-color: var(--bg-typhoon); color: black; font-weight: bold; }
        .shift-return { background-color: #b3e5fc; color: black; font-weight: bold; }
        .shift-business { background-color: #fff9c4; color: black; font-weight: bold; }
        .shift-absent { background-color: #ffccbc; color: black; font-weight: bold; }

        .daily-mark-select { width: 100%; height: 38px; border: 1px solid #ccc; background-color: #ffffff; font-size: 16px; font-weight: bold; text-align: center; text-align-last: center; appearance: none; -webkit-appearance: none; -moz-appearance: none; cursor: pointer; outline: none; }
        .daily-mark-select:disabled { cursor: not-allowed; opacity: 1 !important; background-color: #ffffff !important; color: inherit !important; }

        td.pending-edit select { outline: 3px solid #ffc107; background-color: #fff3cd !important; }

        /* 十字高亮效果 */
        body.crosshair-active td.crosshair-highlight, body.crosshair-active th.crosshair-highlight { background-color: #ffeaa7 !important; transition: background-color 0.15s ease; }
        body.crosshair-active td.crosshair-highlight select { background-color: #ffeaa7 !important; }

        .marquee-container { flex-shrink: 0; border: 1px solid #e2e2e2; border-radius: 4px; background: #fffdf7; padding: 6px 0; overflow: hidden; position: relative; white-space: nowrap; box-sizing: border-box; }
        .marquee-content { display: inline-block; padding-left: 100%; animation: scrollMarquee 30s linear infinite; font-weight: bold; color: #d9534f; font-size: 14px; }
        @keyframes scrollMarquee { 0% { transform: translateX(0%); } 100% { transform: translateX(-200%); } }
        
        .extra-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; width: 100%; flex-shrink: 0; }
    </style>
</head>
<body>

<button id="confirmBtn" class="btn-confirm" disabled>✔ Confirm / 確認儲存 (0)</button>
<div id="syncStatus" class="sync-status">☁️ 雲端同步中...</div>

<!-- 登入視窗 -->
<div id="loginOverlay" class="login-overlay">
    <div class="login-card">
        <h2>系統登入(S1~S4)</h2>
        <div class="login-field">
            <label for="loginSquadSelect">班級</label>
            <select id="loginSquadSelect">
                <option value="">-- 請選擇班級 --</option>
                <option value="S1">S1</option>
                <option value="S2">S2</option>
                <option value="S3">S3</option>
                <option value="S4">S4</option>
            </select>
        </div>
        <div class="login-field">
            <label for="loginNameSelect">員工姓名</label>
            <select id="loginNameSelect">
                <option value="">-- 請選擇姓名 --</option>
            </select>
        </div>
        <div class="login-field">
            <label for="loginPasswordInput">密碼</label>
            <input type="password" id="loginPasswordInput" placeholder="預設密碼：0000">
        </div>
        <button id="loginSubmitBtn" class="login-btn">登入</button>
        <div id="loginErrorMsg" class="login-error">請選擇班級、姓名或密碼錯誤！</div>
    </div>
</div>

<!-- 修改密碼視窗 -->
<div id="changePwdModal" class="login-overlay" style="display: none; z-index: 10000;">
    <div class="login-card">
        <h2>修改密碼</h2>
        <div class="login-field">
            <label for="oldPwdInput">舊密碼</label>
            <input type="password" id="oldPwdInput" placeholder="請輸入原密碼">
        </div>
        <div class="login-field">
            <label for="newPwdInput">新密碼</label>
            <input type="password" id="newPwdInput" placeholder="請輸入新密碼">
        </div>
        <div class="login-field">
            <label for="confirmPwdInput">確認新密碼</label>
            <input type="password" id="confirmPwdInput" placeholder="請再次輸入新密碼">
        </div>
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button id="cancelPwdBtn" class="login-btn" style="background-color: #6c757d;">取消</button>
            <button id="savePwdBtn" class="login-btn">儲存修改</button>
        </div>
        <div id="pwdErrorMsg" class="login-error"></div>
    </div>
</div>

<!-- 編輯跑馬燈視窗 -->
<div id="marqueeModal" class="login-overlay" style="display: none; z-index: 10000;">
    <div class="login-card">
        <h2 id="marqueeModalTitle">編輯跑馬燈文字</h2>
        <div class="login-field">
            <label for="marqueeInput">文字內容</label>
            <textarea id="marqueeInput" rows="3" style="width: 100%;"></textarea>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button id="cancelMarqueeBtn" class="login-btn" style="background-color: #6c757d;">取消</button>
            <button id="saveMarqueeBtn" class="login-btn">儲存</button>
        </div>
        <div id="marqueeErrorMsg" class="login-error"></div>
    </div>
</div>

<!-- 管理班表人員視窗 -->
<div id="employeeModal" class="login-overlay" style="display: none; z-index: 10000;">
    <div class="login-card" style="text-align: left;">
        <h2 id="empModalTitle">管理班表人員</h2>
        <div class="login-field">
            <label>人員名單 (一行一個姓名，直接新增或刪除)</label>
            <textarea id="employeeListInput" rows="12" style="width: 100%;"></textarea>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 15px; justify-content: flex-end;">
            <button id="cancelEmpBtn" class="login-btn" style="background-color: #6c757d; width: auto; padding: 8px 20px;">取消</button>
            <button id="saveEmpBtn" class="login-btn" style="width: auto; padding: 8px 20px;">儲存名單</button>
        </div>
        <div id="empErrorMsg" class="login-error"></div>
    </div>
</div>

<!-- 自定義雙語確認視窗 -->
<div id="confirmModal" class="custom-modal-overlay">
    <div class="custom-modal-box">
        <h3 id="confirmModalTitle">Confirm / 確認動作</h3>
        <p id="confirmModalText">Are you sure? / 確定要執行嗎？</p>
        <div class="modal-btn-group">
            <button id="confirmModalYes" class="modal-btn-confirm">Confirm / 確定</button>
            <button id="confirmModalNo" class="modal-btn-cancel">Cancel / 取消</button>
        </div>
    </div>
</div>

<!-- 成功提示視窗 -->
<div id="successModal" class="custom-modal-overlay">
    <div class="custom-modal-box">
        <h3>Data saved successfully!<br>資料儲存成功！</h3>
        <div class="modal-btn-group" style="justify-content: center;">
            <button id="modalConfirmBtn" class="modal-btn-confirm">Confirm / 確認</button>
        </div>
    </div>
</div>

<!-- 主應用 -->
<div id="mainApp" class="main-app">
    <div class="header-controls">
        <div class="left-controls">
            <div class="control-group">
                <span>年份</span>
                <select id="yearSelect"></select>
            </div>
            <div class="control-group">
                <span>月份</span>
                <select id="monthSelect"></select>
            </div>
            <div class="control-group" id="otLimitGroup">
                <span>加班限制</span>
                <select id="otLimitSelect">
                    <option value="">空白</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                </select>
            </div>
            <div class="total-stats-group">
                <span id="totalOtDisplay" class="stat-badge stat-badge-ot">全班加班: 0天</span>
                <span id="totalLvDisplay" class="stat-badge stat-badge-lv">全班請假: 0天</span>
                <span id="totalUaDisplay" class="stat-badge stat-badge-ua">加班未到: 0天</span>
            </div>
        </div>
        <div class="right-controls">
            <div class="control-group">
                <span>查看班表</span>
                <select id="viewSquadSelect">
                    <option value="S1">S1</option>
                    <option value="S2">S2</option>
                    <option value="S3">S3</option>
                    <option value="S4">S4</option>
                </select>
            </div>
            <button id="highlightBtn" class="highlight-btn" disabled>十字高亮：關</button>
            <button id="formStatusBtn" class="form-status-btn open">填表：開啟</button>
            <div id="userInfoDisplay" class="user-info">👤 未登入</div>
            <button id="changePwdBtn" class="change-pwd-btn">修改密碼</button>
            <button id="logoutBtn" class="logout-btn">登出</button>
            <button id="toggleStatsBtn" class="toggle-btn">隱藏統計</button>
        </div>
    </div>
    
    <div class="extra-controls">
        <button id="editMarqueeBtn" class="edit-marquee-btn" style="display:none;">📝 編輯跑馬燈</button>
        <button id="editEmployeeBtn" class="edit-employee-btn" style="display:none;">👥 管理班表人員</button>
    </div>

    <div class="table-container">
        <table id="scheduleTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="marquee-container">
        <div id="marqueeText" class="marquee-content">※"G"→加班；"C"→加班費1倍；"換"→換班日(不加班)；"歲"→歲修(不上班)；"旺"→尾牙(不上班)。</div>
    </div>
</div>

<script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzLY435Gr3k6783bG__8TM0xs04CDLztMghV3Et4LX411iGTEt3so3zYSOVZlo27qPl/exec";

    // 預設名單
    const squadEmployeesDefault = {
        S1: ["方慎之","陳泰安","蔡南嘉","李珮菁","朱建穎","王泳淇","吳峻霖","黃詠綺","蘭狄","凱文","勞倫司","安東尼","明華","艾麥倫","邱立斯","拉特","羅內爾","艾佛森"],
        S2: ["黃正忠","張韶眞","陳宥庠","黃威翔","羅翊禎","黃文靖","蔡易良","吳奇玲","詹姆士","達力","山博","羅傑","達路","童氏蓮","羅德","達布","安吉","羅蘭多"],
        S3: ["陳文全","吳國隆","李茂玄","葉秀芬","王俊智","吳慧如","黃筱珊","吳明珠","蘇炫元","托弗","杰倫","艾諾","吳氏莊","納撒","格林","喬司華","喬丹","吉姆"],
        S4: ["陳喬志","楊代億","廖曉彤","蔡靜儀","賴建亦","施榮傑","陰其德","黃譯鋒","楊雅婷","羅啟倫","埃爾默","拉斯特","雷伊","漢斯","達利斯","甘達","特拉多","達爾文"]
    };

    // 各班管理員
    const squadManagers = {
        S1: "方慎之",
        S2: "黃正忠",
        S3: "陳文全",
        S4: "陳喬志"
    };

    const weekDaysTW = ["日", "一", "二", "三", "四", "五", "六"];

    let cloudData = { shifts: {}, passwords: {}, otLimits: {}, settings: {} };
    let pendingChanges = {};

    let currentUser = null;
    let currentSquad = null;
    let currentViewSquad = null;

    async function fetchCloudData() {
        showSync();

            const data = await resp.json();
            if (data) cloudData = data;
            if (cloudData.settings) {
                if (cloudData.settings['form_status'] && !cloudData.settings['S4_form_status']) {
                    cloudData.settings['S4_form_status'] = cloudData.settings['form_status'];
                }
                if (cloudData.settings['dailyMarks'] && !cloudData.settings['S4_dailyMarks']) {
                    cloudData.settings['S4_dailyMarks'] = cloudData.settings['dailyMarks'];
                }
                ['S1','S2','S3','S4'].forEach(sq => {

                    if (cloudData.settings[key]) {

                    } else {

        } catch (err) {

        } finally {

        }

        const rect = targetCell.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;

        const table = document.getElementById('scheduleTable');
        for (let i = 0; i < table.rows.length; i++) {
            const row = table.rows[i];
            let closestCell = null;
            let minDist = Infinity;
            for (let j = 0; j < row.cells.length; j++) {
                const cellRect = row.cells[j].getBoundingClientRect();
                const cellCenterX = cellRect.left + cellRect.width / 2;
                const dist = Math.abs(cellCenterX - centerX);
                if (dist < minDist) { minDist = dist; closestCell = row.cells[j]; }
            }
            if (closestCell) { closestCell.classList.add('crosshair-highlight'); }
        }

    function getS4Default(year, month, day) {
        const shiftCycle = ['日', '夜', '夜', '日', '日', '夜', '夜', '日', '日', '夜', '夜', '日'];
        const utcEpoch = Date.UTC(2025, 11, 31);
        const utcTarget = Date.UTC(year, month - 1, day);
        const diffDays = Math.floor((utcTarget - utcEpoch) / (1000 * 60 * 60 * 24));
        const cycleDay = ((diffDays % 4) + 4) % 4;
        if (cycleDay === 0 || cycleDay === 1) {
            let mIdx = month - 1;
            if (cycleDay === 1) {
                const prevDay = new Date(year, month - 1, day - 1);
                mIdx = prevDay.getMonth();
            }
            return shiftCycle[mIdx] || '';
        }
        return '';
    }

    function getDefaultShift(squad, year, month, day) {
        const s4Val = getS4Default(year, month, day);
        if (squad === 'S4') return s4Val;
        if (squad === 'S3') {
            if (s4Val === '日') return '夜';
            if (s4Val === '夜') return '日';
            return '';
        }
        const d = new Date(year, month-1, day);
        d.setDate(d.getDate() - 2);
        const s2Val = getS4Default(d.getFullYear(), d.getMonth()+1, d.getDate());
        if (squad === 'S2') return s2Val;
        if (s2Val === '日') return '夜';
        if (s2Val === '夜') return '日';
        return '';
    }

    function calculateTotalClassStats(squad, year, month, daysInMonth) {
        const empList = getEmployeeList(squad);
        if (!empList) return;
        let grandTotalOt = 0, grandTotalLv = 0, grandTotalUa = 0;
        empList.forEach(empName => {
            for (let i = 1; i <= daysInMonth; i++) {
                const shiftKey = `${squad}_shift_${year}_${month}_${empName}_${i}`;
                const defaultShift = getDefaultShift(squad, year, month, i);
                let val;
                if (pendingChanges[shiftKey] !== undefined) {
                    val = pendingChanges[shiftKey];
                } else {
                    const savedValue = (cloudData.shifts) ? cloudData.shifts[shiftKey] : undefined;
                    val = (savedValue !== undefined && savedValue !== null) ? savedValue : defaultShift;
                }
                if (val === 'G') grandTotalOt++;
                if (['特', '病', '事', '生'].includes(val)) grandTotalLv++;
                if (val === '未') grandTotalUa++;
            }
        });
        if (totalOtDisplay) totalOtDisplay.textContent = `全班加班: ${grandTotalOt}天`;
        if (totalLvDisplay) totalLvDisplay.textContent = `全班請假: ${grandTotalLv}天`;
        if (totalUaDisplay) totalUaDisplay.textContent = `加班未到: ${grandTotalUa}天`;
    }

    function calculateDailyOtStats(squad, year, month, daysInMonth) {
        const empList = getEmployeeList(squad);
        if (!empList) return;
        for (let i = 1; i <= daysInMonth; i++) {
            const dailyElem = document.getElementById(`daily_ot_${squad}_${year}_${month}_${i}`);
            if (!dailyElem) continue;
            const defaultShift = getDefaultShift(squad, year, month, i);
            if (defaultShift !== '') {
                dailyElem.textContent = '';
                continue;
            }
            let dailyOtCount = 0;
            empList.forEach(empName => {
                const shiftKey = `${squad}_shift_${year}_${month}_${empName}_${i}`;
                let val;
                if (pendingChanges[shiftKey] !== undefined) {
                    val = pendingChanges[shiftKey];
                } else {
                    const savedValue = (cloudData.shifts) ? cloudData.shifts[shiftKey] : undefined;
                    val = (savedValue !== undefined && savedValue !== null) ? savedValue : defaultShift;
                }
                if (val === 'G') dailyOtCount++;
            });
            dailyElem.textContent = dailyOtCount;
        }
    }

            <td class="stats-ot"><div class="cell-content">-</div></td>
            <td class="stats-lv"><div class="cell-content">-</div></td>
            <td class="col-name"><div class="cell-content">加班人數</div></td>
        `;
        for (let i = 1; i <= daysInMonth; i++) {
            let td = document.createElement('td');
            td.innerHTML = `<div class="cell-content" id="daily_ot_${viewSquad}_${year}_${month}_${i}"></div>`;
            trDailyOt.appendChild(td);
        }
        tbody.appendChild(trDailyOt);

        calculateTotalClassStats(viewSquad, year, month, daysInMonth);
        calculateDailyOtStats(viewSquad, year, month, daysInMonth);
        updateConfirmBtnState();
    }

    function calculateStats(empName, squad, year, month, daysInMonth, otCellId, lvCellId) {
        let otCount = 0, lvCount = 0;
        for (let i = 1; i <= daysInMonth; i++) {
            const shiftKey = `${squad}_shift_${year}_${month}_${empName}_${i}`;
            const defaultShift = getDefaultShift(squad, year, month, i);
            let val;
            if (pendingChanges[shiftKey] !== undefined) {
                val = pendingChanges[shiftKey];
            } else {
                const savedValue = (cloudData.shifts) ? cloudData.shifts[shiftKey] : undefined;
                val = (savedValue !== undefined && savedValue !== null) ? savedValue : defaultShift;
            }
            if (val === 'G') otCount++;
            if (['特', '病', '事', '生'].includes(val)) lvCount++;
        }
        const otElem = document.getElementById(otCellId);
        const lvElem = document.getElementById(lvCellId);
        if (otElem) otElem.textContent = otCount;
        if (lvElem) lvElem.textContent = lvCount;
    }

    function updateCellColor(td, value) {
        td.classList.remove('shift-day', 'shift-night', 'shift-g', 'shift-unattended', 'shift-special', 'shift-personal', 'shift-sick', 'shift-physio', 'shift-typhoon', 'shift-return', 'shift-business', 'shift-absent');
        switch (value) {
            case '日': td.classList.add('shift-day'); break;
            case '夜': td.classList.add('shift-night'); break;
            case 'G': td.classList.add('shift-g'); break;
            case '未': td.classList.add('shift-unattended'); break;
            case '特': td.classList.add('shift-special'); break;
            case '事': td.classList.add('shift-personal'); break;
            case '病': td.classList.add('shift-sick'); break;
            case '生': td.classList.add('shift-physio'); break;
            case '颱': td.classList.add('shift-typhoon'); break;
            case '返': td.classList.add('shift-return'); break;
            case '差': td.classList.add('shift-business'); break;
            case '曠': td.classList.add('shift-absent'); break;
        }
    }

    viewSquadSelect.addEventListener('change', function() {
        const newSquad = this.value;
        if (newSquad === currentViewSquad) return;
        if (currentViewSquad === currentSquad && Object.keys(pendingChanges).length > 0 && currentUser !== squadManagers[currentSquad]) {
            if (!confirm('切換班表將捨棄目前未儲存的變更，確定要繼續嗎？')) {
                this.value = currentViewSquad;
                return;
            }
        }
        pendingChanges = {};
        currentViewSquad = newSquad;
        updateFormStatusUI();
        updateHighlightBtnUI();
        renderTable();
    });

    loginSubmitBtn.addEventListener('click', async function() {
        const squad = loginSquadSelect.value;
        const selectedUser = loginNameSelect.value;
        const inputPwd = loginPasswordInput.value;
        if (!squad || !selectedUser) {
            loginErrorMsg.style.display = 'block';
            return;
        }
        const correctPwd = getUserPassword(selectedUser);
        if (inputPwd === correctPwd) {
            currentSquad = squad;
            currentUser = selectedUser;
            currentViewSquad = squad;
            sessionStorage.setItem('schedule_current_squad', squad);
            sessionStorage.setItem('schedule_current_user', selectedUser);
            loginErrorMsg.style.display = 'none';
            loginPasswordInput.value = '';
            viewSquadSelect.value = squad;
            showSync();
            await fetchCloudData();
            mainApp.style.display = 'flex';
            loginOverlay.style.display = 'none';
            userInfoDisplay.textContent = `👤 ${currentUser} (${currentSquad})`;
            updateFormStatusUI();
            updateHighlightBtnUI();
            renderTable();
        } else {
            loginErrorMsg.style.display = 'block';
        }
    });

    async function checkLoginStatus() {
        const savedSquad = sessionStorage.getItem('schedule_current_squad');
        const savedUser = sessionStorage.getItem('schedule_current_user');
        if (savedSquad && savedUser) {
            await fetchCloudData();
            currentSquad = savedSquad;
            currentUser = savedUser;
            currentViewSquad = savedSquad;
            viewSquadSelect.value = savedSquad;
            mainApp.style.display = 'flex';
            loginOverlay.style.display = 'none';
            userInfoDisplay.textContent = `👤 ${currentUser} (${currentSquad})`;
            updateFormStatusUI();
            updateHighlightBtnUI();
            renderTable();
        } else {
            loginOverlay.style.display = 'flex';
            mainApp.style.display = 'none';
        }
    }

    changePwdBtn.addEventListener('click', function() {
        oldPwdInput.value = ''; newPwdInput.value = ''; confirmPwdInput.value = '';
        pwdErrorMsg.style.display = 'none';
        changePwdModal.style.display = 'flex';
    });

    cancelPwdBtn.addEventListener('click', () => changePwdModal.style.display = 'none');

    // ✅ 強制檢測修改密碼是否真正同步至雲端
    savePwdBtn.addEventListener('click', async function() {
        const correctPwd = getUserPassword(currentUser);
        const oldVal = oldPwdInput.value;
        const newVal = newPwdInput.value;
        const confirmVal = confirmPwdInput.value;
        
        if (oldVal !== correctPwd) {
            pwdErrorMsg.textContent = "舊密碼錯誤！";
            pwdErrorMsg.style.display = "block"; return;
        }
        if (!newVal) {
            pwdErrorMsg.textContent = "新密碼不可空白！";
            pwdErrorMsg.style.display = "block"; return;
        }
        if (newVal !== confirmVal) {
            pwdErrorMsg.textContent = "兩次輸入的新密碼不一致！";
            pwdErrorMsg.style.display = "block"; return;
        }
        
        if(!cloudData.passwords) cloudData.passwords = {};
        cloudData.passwords[currentUser] = newVal;
        await postCloudData({ action: 'savePassword', key: currentUser, value: newVal });

        // 因為 no-cors 無法讀取回傳值，我們延遲 800ms 後強制重新拉取一次雲端
        await new Promise(r => setTimeout(r, 800));
        await fetchCloudData();

        // 比對拉回來的真實雲端密碼，如果不等於 newVal，則代表後端寫入失敗！
        if (getUserPassword(currentUser) !== newVal) {
            pwdErrorMsg.textContent = "❌ 密碼修改失敗！雲端資料未同步 (GAS 後端無效)。請檢查您的 Google Apps Script 後端程式碼：確認 `doPost` 是否有正確寫入 `e.postData.contents` 的 JSON 資料到試算表。";
            pwdErrorMsg.style.display = "block";
            return;
        }

        alert("密碼修改成功！");
        changePwdModal.style.display = 'none';
    });

    // 跑馬燈邏輯
    editMarqueeBtn.addEventListener('click', function() {
        const marqueeKey = currentSquad + '_marqueeText';
        const currentText = (cloudData.settings && cloudData.settings[marqueeKey]) 
                            ? cloudData.settings[marqueeKey] 
                            : `※"G"→加班；"C"→加班費1倍；"換"→換班日(不加班)；"歲"→歲修(不上班)；"旺"→尾牙(不上班)。`;
        marqueeInput.value = currentText;
        marqueeErrorMsg.style.display = 'none';
        marqueeModalTitle.textContent = `編輯跑馬燈文字 (${currentSquad})`;
        marqueeModal.style.display = 'flex';
    });
    cancelMarqueeBtn.addEventListener('click', () => marqueeModal.style.display = 'none');
    saveMarqueeBtn.addEventListener('click', async function() {
        const newText = marqueeInput.value.trim();
        if (!newText) {
            marqueeErrorMsg.textContent = "跑馬燈內容不可空白！";
            marqueeErrorMsg.style.display = "block"; return;
        }
        const marqueeKey = currentSquad + '_marqueeText';
        if(!cloudData.settings) cloudData.settings = {};
        cloudData.settings[marqueeKey] = newText;
        await postCloudData({ action: 'saveSetting', key: marqueeKey, value: newText });
        marqueeText.textContent = newText;
        alert(`「${currentSquad}」跑馬燈文字已更新！`);
        marqueeModal.style.display = 'none';
    });

    // 管理班表人員邏輯
    editEmployeeBtn.addEventListener('click', function() {
        const currentList = getEmployeeList(currentSquad);
        employeeListInput.value = currentList.join('\n');
        empErrorMsg.style.display = 'none';
        empModalTitle.textContent = `管理班表人員 (${currentSquad})`;
        employeeModal.style.display = 'flex';
    });
    cancelEmpBtn.addEventListener('click', () => employeeModal.style.display = 'none');
    saveEmpBtn.addEventListener('click', async function() {
        const rawText = employeeListInput.value;
        let newList = rawText.split(/\r?\n/).map(n => n.trim()).filter(n => n !== '');
        if (newList.length === 0) {
            empErrorMsg.textContent = "名單不可為空！至少需要一個人。";
            empErrorMsg.style.display = "block"; return;
        }
        const manager = squadManagers[currentSquad];
        if (!newList.includes(manager)) {
            newList.unshift(manager);
        }
        if(!cloudData.settings) cloudData.settings = {};
        cloudData.settings[currentSquad + '_employees'] = JSON.stringify(newList);
        await postCloudData({ action: 'saveSetting', key: currentSquad + '_employees', value: JSON.stringify(newList) });
        alert(`人員名單已更新！共 ${newList.length} 人。`);
        employeeModal.style.display = 'none';
        renderTable();
    });

    logoutBtn.addEventListener('click', function() {
        sessionStorage.removeItem('schedule_current_squad');
        sessionStorage.removeItem('schedule_current_user');
        currentUser = null; currentSquad = null; currentViewSquad = null;
        pendingChanges = {};
        loginSquadSelect.value = ''; loginNameSelect.innerHTML = '<option value="">-- 請選擇姓名 --</option>';
        loginPasswordInput.value = ''; checkLoginStatus();
    });

    otLimitSelect.addEventListener('change', function() {
        if (!currentSquad || !currentViewSquad || currentViewSquad !== currentSquad) return;
        if (currentUser !== squadManagers[currentSquad]) return;
        const year = yearSelect.value; const month = monthSelect.value;
        const limitKey = `${currentSquad}_otlimit_${year}_${month}`;
        if (!cloudData.otLimits) cloudData.otLimits = {};
        cloudData.otLimits[limitKey] = this.value;
        postCloudData({ action: 'saveOtLimit', key: limitKey, value: this.value });
    });

    const now = new Date(); const currentYear = now.getFullYear();
    for (let y = currentYear - 5; y <= currentYear + 5; y++) {
        let opt = document.createElement('option'); opt.value = y; opt.text = y;
        if (y === currentYear) opt.selected = true; yearSelect.appendChild(opt);
    }
    for (let m = 1; m <= 12; m++) {
        let opt = document.createElement('option'); opt.value = m; opt.text = m;
        if (m === (now.getMonth() + 1)) opt.selected = true; monthSelect.appendChild(opt);
    }

    yearSelect.addEventListener('change', renderTable);
    monthSelect.addEventListener('change', renderTable);

    toggleStatsBtn.addEventListener('click', function() {
        document.body.classList.toggle('hide-stats');
        this.textContent = document.body.classList.contains('hide-stats') ? '顯示統計' : '隱藏統計';
    });

    checkLoginStatus();
</script>
</body>
</html>
