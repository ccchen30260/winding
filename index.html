<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>捲繞排班(S1~S4)</title>
    <style>
        :root {
            --bg-day: #c6e0b4;
            --bg-g: #ffff00;
            --bg-special: #ff00ff;
            --bg-personal: #8064a2;
            --bg-night: #fce4d6;
            --text-personal: #ffffff;
            --bg-sick: #ff0000;
            --text-sick: #ffffff;
            --bg-physio: #ffe6cc;
            --bg-typhoon: #dae8fc;
            --bg-unattended: #d0d0d0;
            --border-color: #a0a0a0;
        }

        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            margin: 10px;
            background-color: #fcfcfc;
            touch-action: manipulation;
        }

        .sync-status {
            position: fixed;
            bottom: 10px;
            right: 110px;
            background-color: rgba(0,0,0,0.75);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: none;
            z-index: 10001;
        }

        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(245, 247, 250, 0.98);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-card {
            background-color: #ffffff;
            padding: 30px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-sizing: border-box;
            border: 1px solid #e0e0e0;
        }

        .login-card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #333;
            font-size: 20px;
        }

        .login-field {
            margin-bottom: 15px;
            text-align: left;
        }

        .login-field label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
            color: #555;
        }

        .login-field input, .login-field select {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            background-color: #fff;
            outline: none;
        }

        .login-btn {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #28a745;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .login-btn:hover { background-color: #218838; }

        .login-error {
            color: #dc3545;
            font-size: 13px;
            margin-top: 12px;
            display: none;
            font-weight: bold;
        }

        .main-app { display: none; }

        .header-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        .left-controls, .right-controls {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            max-width: 100%;
        }

        .left-controls { flex: 1 1 auto; }

        .control-group {
            display: flex;
            align-items: center;
            background-color: #00ff00;
            padding: 2px 4px;
            border: 1px solid #000;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .control-group span {
            font-weight: bold;
            padding: 0 4px;
            white-space: nowrap;
            font-size: 13px;
        }

        .total-stats-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .stat-badge {
            font-size: 13px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            white-space: nowrap;
            border: 1px solid #bbb;
        }

        .stat-badge-ot { background-color: #e6f7ff; color: #0073e6; border-color: #91d5ff; }
        .stat-badge-lv { background-color: #ffe6e6; color: #d9363e; border-color: #ffa39e; }
        .stat-badge-ua { background-color: #e2e2e2; color: #495057; border-color: #ced4da; }

        select {
            font-size: 14px;
            padding: 4px;
            border: 1px solid #ccc;
            background-color: #ffe6e6;
            border-radius: 4px;
            outline: none;
        }

        select:disabled {
            background-color: #e0e0e0;
            color: #666;
            cursor: not-allowed;
        }

        .user-info {
            font-size: 13px;
            font-weight: bold;
            color: #333;
            background-color: #e9ecef;
            padding: 5px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .change-pwd-btn, .logout-btn, .toggle-btn, .form-status-btn, .highlight-btn {
            padding: 6px 8px;
            font-size: 12px;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
        }

        .change-pwd-btn { background-color: #17a2b8; }
        .logout-btn { background-color: #dc3545; }
        .toggle-btn { background-color: #007bff; }
        .highlight-btn { background-color: #6f42c1; }
        .highlight-btn.active { background-color: #28a745; }
        .highlight-btn:disabled { cursor: not-allowed; opacity: 0.7; }

        .form-status-btn.open { background-color: #28a745; }
        .form-status-btn.closed { background-color: #6c757d; }
        .form-status-btn:disabled { cursor: not-allowed; opacity: 0.85; }

        .btn-confirm {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 9999;
            display: none;
            padding: 15px 25px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            background-color: #28a745;
            border: none;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }
        .btn-confirm:hover:not(:disabled) {
            background-color: #218838;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.6);
        }
        .btn-confirm:active:not(:disabled) {
            transform: scale(0.95);
        }
        .btn-confirm:disabled {
            background-color: #a0a0a0 !important;
            box-shadow: none !important;
            cursor: default !important;
            transform: scale(1) !important;
            opacity: 1 !important;
        }
        @media screen and (max-width: 600px) {
            .btn-confirm {
                bottom: 15px;
                right: 15px;
                padding: 12px 18px;
                font-size: 17px;
            }
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        .custom-modal-box {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .custom-modal-box h3 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 22px;
            line-height: 1.5;
        }
        .custom-modal-box p {
            font-size: 16px;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .modal-btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .modal-btn-confirm, .modal-btn-cancel {
            padding: 12px 30px;
            font-size: 17px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal-btn-confirm {
            background-color: #28a745;
            color: #fff;
        }
        .modal-btn-confirm:hover {
            background-color: #218838;
        }
        .modal-btn-cancel {
            background-color: #e9ecef;
            color: #333;
            border: 1px solid #ced4da;
        }
        .modal-btn-cancel:hover {
            background-color: #dde0e3;
        }

        .table-container {
            overflow: auto;
            max-height: 80vh;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            background-color: white;
            -webkit-overflow-scrolling: touch;
        }

        table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            text-align: center;
            font-size: 14px;
            background-color: white;
            white-space: nowrap;
        }

        th, td {
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 0;
            min-width: 32px;
            height: 38px;
            box-sizing: border-box;
            background-clip: padding-box;
        }

        th:first-child, td:first-child { border-left: 1px solid var(--border-color); }
        tr:first-child th { border-top: 1px solid var(--border-color); }

        th { background-color: #f2f2f2; font-weight: bold; }

        thead tr:nth-child(1) th { position: sticky; top: 0; z-index: 1; }
        thead tr:nth-child(2) th { position: sticky; top: 38px; z-index: 1; }
        thead tr:nth-child(3) th { position: sticky; top: 76px; z-index: 1; }

        .stats-ot { position: sticky; left: 0; width: 40px; min-width: 40px; z-index: 2; color: #00b0f0; background-color: #e6f7ff; font-weight: bold; }
        .stats-lv { position: sticky; left: 40px; width: 40px; min-width: 40px; z-index: 2; color: #ff0000; background-color: #ffe6e6; font-weight: bold; }
        .col-name { position: sticky; left: 80px; width: 65px; min-width: 65px; z-index: 2; font-weight: bold; background-color: #fafafa; box-shadow: 2px 0 5px -2px rgba(0,0,0,0.3); }

        thead th.stats-ot, thead th.stats-lv, thead th.col-name { z-index: 3 !important; background-color: #e0e0e0; color: black; }

        body.hide-stats .stats-ot, body.hide-stats .stats-lv { display: none !important; }
        body.hide-stats .col-name { left: 0 !important; }

        .weekend-header { color: red; }
        .today-header { background-color: #00ffff !important; }

        tr.daily-ot-row {
            background-color: #fffbe6;
            font-weight: bold;
        }
        tr.daily-ot-row td {
            background-color: #fffbe6;
            color: #d48806;
            border-top: 2px solid #ffe58f;
        }
        tr.daily-ot-row td.col-name {
            background-color: #fff1b8;
            color: #873800;
        }
        tr.daily-ot-row td.stats-ot, tr.daily-ot-row td.stats-lv {
            background-color: #fff1b8;
        }

        .cell-content { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; min-height: 38px; box-sizing: border-box; }

        .shift-select {
            width: 100%; height: 38px; border: none; background-color: transparent;
            font-size: 15px; font-family: inherit; text-align: center; text-align-last: center;
            appearance: none; -webkit-appearance: none; -moz-appearance: none; cursor: pointer; outline: none;
            color: inherit; font-weight: inherit;
        }

        .shift-select:disabled {
            cursor: not-allowed;
            opacity: 0.9;
        }

        .shift-day { background-color: var(--bg-day); }
        .shift-night { background-color: var(--bg-night); }
        .shift-g { background-color: var(--bg-g); color: black; font-weight: bold; }
        .shift-unattended { background-color: var(--bg-unattended); color: black; font-weight: bold; }
        .shift-special { background-color: var(--bg-special); color: black; font-weight: bold; }
        .shift-personal { background-color: var(--bg-personal); color: var(--text-personal); font-weight: bold; }
        .shift-sick { background-color: var(--bg-sick); color: var(--text-sick); font-weight: bold; }
        .shift-physio { background-color: var(--bg-physio); color: black; font-weight: bold; }
        .shift-typhoon { background-color: var(--bg-typhoon); color: black; font-weight: bold; }
        .shift-return { background-color: #b3e5fc; color: black; font-weight: bold; }
        .shift-business { background-color: #fff9c4; color: black; font-weight: bold; }
        .shift-absent { background-color: #ffccbc; color: black; font-weight: bold; }

        .daily-mark-select {
            width: 100%;
            height: 38px;
            border: 1px solid #ccc;
            background-color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            text-align-last: center;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            cursor: pointer;
            outline: none;
        }
        .daily-mark-select:disabled {
            background-color: #f0f0f0;
            cursor: not-allowed;
        }

        td.pending-edit select {
            outline: 3px solid #ffc107;
            background-color: #fff3cd !important;
        }

        /* 十字高亮效果 */
        body.crosshair-active td.crosshair-highlight,
        body.crosshair-active th.crosshair-highlight {
            background-color: #ffeaa7 !important;
            transition: background-color 0.15s ease;
        }
        body.crosshair-active td.crosshair-highlight select {
            background-color: #ffeaa7 !important;
        }
    </style>
</head>
<body>

<button id="confirmBtn" class="btn-confirm" disabled>✔ Confirm / 確認儲存 (0)</button>
<div id="syncStatus" class="sync-status">☁️ 雲端同步中...</div>

<!-- 登入視窗 -->
<div id="loginOverlay" class="login-overlay">
    <div class="login-card">
        <h2>系統登入(S1~S4)</h2>
        <div class="login-field">
            <label for="loginSquadSelect">班級</label>
            <select id="loginSquadSelect">
                <option value="">-- 請選擇班級 --</option>
                <option value="S1">S1</option>
                <option value="S2">S2</option>
                <option value="S3">S3</option>
                <option value="S4">S4</option>
            </select>
        </div>
        <div class="login-field">
            <label for="loginNameSelect">員工姓名</label>
            <select id="loginNameSelect">
                <option value="">-- 請選擇姓名 --</option>
            </select>
        </div>
        <div class="login-field">
            <label for="loginPasswordInput">密碼</label>
            <input type="password" id="loginPasswordInput" placeholder="預設密碼：0000">
        </div>
        <button id="loginSubmitBtn" class="login-btn">登入</button>
        <div id="loginErrorMsg" class="login-error">請選擇班級、姓名或密碼錯誤！</div>
    </div>
</div>

<!-- 修改密碼視窗 -->
<div id="changePwdModal" class="login-overlay" style="display: none; z-index: 10000;">
    <div class="login-card">
        <h2>修改密碼</h2>
        <div class="login-field">
            <label for="oldPwdInput">舊密碼</label>
            <input type="password" id="oldPwdInput" placeholder="請輸入原密碼">
        </div>
        <div class="login-field">
            <label for="newPwdInput">新密碼</label>
            <input type="password" id="newPwdInput" placeholder="請輸入新密碼">
        </div>
        <div class="login-field">
            <label for="confirmPwdInput">確認新密碼</label>
            <input type="password" id="confirmPwdInput" placeholder="請再次輸入新密碼">
        </div>
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button id="cancelPwdBtn" class="login-btn" style="background-color: #6c757d;">取消</button>
            <button id="savePwdBtn" class="login-btn">儲存修改</button>
        </div>
        <div id="pwdErrorMsg" class="login-error"></div>
    </div>
</div>

<!-- 自定義雙語確認視窗 -->
<div id="confirmModal" class="custom-modal-overlay">
    <div class="custom-modal-box">
        <h3 id="confirmModalTitle">Confirm / 確認動作</h3>
        <p id="confirmModalText">Are you sure? / 確定要執行嗎？</p>
        <div class="modal-btn-group">
            <button id="confirmModalYes" class="modal-btn-confirm">Confirm / 確定</button>
            <button id="confirmModalNo" class="modal-btn-cancel">Cancel / 取消</button>
        </div>
    </div>
</div>

<!-- 成功提示視窗 -->
<div id="successModal" class="custom-modal-overlay">
    <div class="custom-modal-box">
        <h3>Data saved successfully!<br>資料儲存成功！</h3>
        <div class="modal-btn-group" style="justify-content: center;">
            <button id="modalConfirmBtn" class="modal-btn-confirm">Confirm / 確認</button>
        </div>
    </div>
</div>

<!-- 主應用 -->
<div id="mainApp" class="main-app">
    <div class="header-controls">
        <div class="left-controls">
            <div class="control-group">
                <span>年份</span>
                <select id="yearSelect"></select>
            </div>
            <div class="control-group">
                <span>月份</span>
                <select id="monthSelect"></select>
            </div>
            <div class="control-group">
                <span>加班限制</span>
                <select id="otLimitSelect">
                    <option value="">空白</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                </select>
            </div>
            <div class="total-stats-group">
                <span id="totalOtDisplay" class="stat-badge stat-badge-ot">全班加班: 0天</span>
                <span id="totalLvDisplay" class="stat-badge stat-badge-lv">全班請假: 0天</span>
                <span id="totalUaDisplay" class="stat-badge stat-badge-ua">加班未到: 0天</span>
            </div>
        </div>
        <div class="right-controls">
            <div class="control-group">
                <span>查看班表</span>
                <select id="viewSquadSelect">
                    <option value="S1">S1</option>
                    <option value="S2">S2</option>
                    <option value="S3">S3</option>
                    <option value="S4">S4</option>
                </select>
            </div>
            <button id="highlightBtn" class="highlight-btn" disabled>十字高亮：關</button>
            <button id="formStatusBtn" class="form-status-btn open">填表：開啟</button>
            <div id="userInfoDisplay" class="user-info">👤 未登入</div>
            <button id="changePwdBtn" class="change-pwd-btn">修改密碼</button>
            <button id="logoutBtn" class="logout-btn">登出</button>
            <button id="toggleStatsBtn" class="toggle-btn">隱藏統計</button>
        </div>
    </div>

    <div class="table-container">
        <table id="scheduleTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzLY435Gr3k6783bG__8TM0xs04CDLztMghV3Et4LX411iGTEt3so3zYSOVZlo27qPl/exec";

        S4: ["陳喬志","楊代億","廖曉彤","蔡靜儀","賴建亦","施榮傑","陰其德","黃譯鋒","楊雅婷","羅啟倫","埃爾默","拉斯特","雷伊","漢斯","達利斯","甘達","特拉多","達爾文"]

    // 各班管理員
    const squadManagers = {

    const weekDaysTW = ["日", "一", "二", "三", "四", "五", "六"];

    let cloudData = { shifts: {}, passwords: {}, otLimits: {}, settings: {} };

    let currentUser = null;

    const syncStatus = document.getElementById('syncStatus');

    const changePwdModal = document.getElementById('changePwdModal');

    const highlightBtn = document.getElementById('highlightBtn');
    
    const confirmBtn = document.getElementById('confirmBtn');
    const confirmModal = document.getElementById('confirmModal');

    async function fetchCloudData() {
        showSync();
        try {
            const resp = await fetch(`${GAS_WEB_APP_URL}?action=getAllData`);
            const data = await resp.json();
            if (data) cloudData = data;
            if (cloudData.settings) {
                if (cloudData.settings['form_status'] && !cloudData.settings['S4_form_status']) {
                    cloudData.settings['S4_form_status'] = cloudData.settings['form_status'];
                }
                if (cloudData.settings['dailyMarks'] && !cloudData.settings['S4_dailyMarks']) {
                    cloudData.settings['S4_dailyMarks'] = cloudData.settings['dailyMarks'];
                }
                ['S1','S2','S3','S4'].forEach(sq => {
                    const key = sq + '_dailyMarks';
                    if (cloudData.settings[key]) {
                        try {
                            cloudData.settings[key] = JSON.parse(cloudData.settings[key]);
                        } catch(e) { cloudData.settings[key] = {}; }
                    } else {
                        cloudData.settings[key] = {};
                    }
                });
            }
            if (!cloudData.otLimits) cloudData.otLimits = {};
        } catch (err) {
            console.error("雲端讀取失敗", err);
        } finally {
            hideSync();
        }
    }

    async function postCloudData(payload) {
        showSync();
        try {
            await fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        } catch (err) {
            console.error("雲端寫入失敗", err);
        } finally {
            hideSync();
        }
    }

    function updateFormStatusUI() {
        if (!currentSquad || !currentViewSquad) return;
        const isMySquad = (currentViewSquad === currentSquad);
        const isManager = (currentUser === squadManagers[currentViewSquad]);
        const open = isFormOpen(currentViewSquad);
        formStatusBtn.textContent = open ? '填表：開啟' : '填表：關閉';
        formStatusBtn.className = 'form-status-btn ' + (open ? 'open' : 'closed');

        const isManager = (currentUser === squadManagers[currentSquad]);
        highlightBtn.disabled = !isManager;
        highlightBtn.textContent = crosshairEnabled ? '十字高亮：開' : '十字高亮：關';
        highlightBtn.className = 'highlight-btn' + (crosshairEnabled ? ' active' : '');
        document.body.classList.toggle('crosshair-active', crosshairEnabled);
    }

    // 十字高亮開關
    highlightBtn.addEventListener('click', function() {
        if (!currentUser || currentUser !== squadManagers[currentSquad]) return;
        crosshairEnabled = !crosshairEnabled;
        updateHighlightBtnUI();
    });

    // 十字高亮 hover 事件
    const tableContainer = document.querySelector('.table-container');
    tableContainer.addEventListener('mouseover', function(e) {
        if (!crosshairEnabled) return;
        const td = e.target.closest('td');
        const th = e.target.closest('th');
        const cell = td || th;
        if (!cell) return;
        
        // 清除之前的高亮
        document.querySelectorAll('.crosshair-highlight').forEach(el => el.classList.remove('crosshair-highlight'));
        
        const table = document.getElementById('scheduleTable');
        const rowIndex = cell.parentElement.rowIndex;
        const colIndex = cell.cellIndex;
        
        // 高亮整列 (該 row 的所有 th, td)
        const row = table.rows[rowIndex];
        if (row) {
            Array.from(row.cells).forEach(c => c.classList.add('crosshair-highlight'));
        }
        // 高亮整欄 (該 col 的所有 th, td)
        for (let i = 0; i < table.rows.length; i++) {
            const cellInCol = table.rows[i].cells[colIndex];
            if (cellInCol) cellInCol.classList.add('crosshair-highlight');
        }
    });

    tableContainer.addEventListener('mouseleave', function() {
        if (!crosshairEnabled) return;
        document.querySelectorAll('.crosshair-highlight').forEach(el => el.classList.remove('crosshair-highlight'));
    });

    formStatusBtn.addEventListener('click', function() {
        if (!currentSquad || !currentViewSquad || currentViewSquad !== currentSquad) return;
        if (currentUser !== squadManagers[currentSquad]) return;
        const nextState = isFormOpen(currentSquad) ? 'closed' : 'open';
        const key = currentSquad + '_form_status';
        if (!cloudData.settings) cloudData.settings = {};
        cloudData.settings[key] = nextState;
        postCloudData({ action: 'saveSetting', key: key, value: nextState });
        updateFormStatusUI();
        renderTable();
    });

    function getS4Default(year, month, day) {
        const shiftCycle = ['日', '夜', '夜', '日', '日', '夜', '夜', '日', '日', '夜', '夜', '日'];
        const utcEpoch = Date.UTC(2025, 11, 31);
        const utcTarget = Date.UTC(year, month - 1, day);
        const diffDays = Math.floor((utcTarget - utcEpoch) / (1000 * 60 * 60 * 24));
        const cycleDay = ((diffDays % 4) + 4) % 4;
        if (cycleDay === 0 || cycleDay === 1) {
            let mIdx = month - 1;
            if (cycleDay === 1) {
                const prevDay = new Date(year, month - 1, day - 1);
                mIdx = prevDay.getMonth();
            }
            return shiftCycle[mIdx] || '';
        }
        return '';
    }
